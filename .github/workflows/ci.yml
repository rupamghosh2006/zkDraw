name: zkDraw CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Contracts — test the compiled Compact contract bindings
  #    (The managed/ artifacts are committed to the repo; the
  #    Midnight Compact compiler is not available on runners.)
  # ─────────────────────────────────────────────────────────────
  contracts:
    name: Contracts — Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Contract Tests (Vitest)
        run: npm test

      - name: Typecheck Contracts (tsc)
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # 2. Backend — test all routes, services and ZK verifier logic
  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend — Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Backend Tests (Vitest)
        run: npm test

      - name: Build Backend Service (tsc)
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # 3. Frontend — typecheck then build the Vite/React app
  #    (No test suite exists for the frontend yet.)
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend Unit Tests (Vitest)
        run: npm test

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build Frontend Application (vite build)
        run: npx vite build

  # ─────────────────────────────────────────────────────────────
  # 4. Deploy to Preview — runs on push to main only, after all
  #    CI jobs pass, using GitHub Environment secrets.
  #    Requires: MIDNIGHT_SEED (wallet seed phrase) in the
  #    "preview" GitHub Environment.
  # ─────────────────────────────────────────────────────────────
  deploy-preview:
    name: Deploy — Midnight Preview Network
    runs-on: ubuntu-latest
    needs: [contracts, backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: preview
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Midnight Preview
        run: npm run deploy:preview
        env:
          MIDNIGHT_SEED: ${{ secrets.MIDNIGHT_SEED }}
